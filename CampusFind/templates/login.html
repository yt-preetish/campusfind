<label>Password<input type="password" name="password" required placeholder="••••••••"></label>
<button class="btn primary full">Sign in</button></form>
<div class="demo-box"><b>Demo:</b> student@campusfind.local / student123</div>
<p class="center muted">New here? <a href="{{url_for('register')}}">Create account</a></p></div></div>
{% endblock %}

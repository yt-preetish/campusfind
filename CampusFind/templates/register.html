{% extends "base.html" %}{% block title %}Register — CampusFind{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><div class="eyebrow">JOIN YOUR CAMPUS</div><h1>Create account</h1><form method="post" class="form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Full name<input name="name" required></label><label>College email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" minlength="6" required></label>
<button class="btn primary full">Create account</button></form>
<p class="center muted">Already registered? <a href="{{url_for('login')}}">Sign in</a></p></div></div>
{% endblock %}
